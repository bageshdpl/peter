# Builds the ready-to-run Windows package (server, web app and extension in
# one zip). To publish a release, change the version in packaging/VERSION and
# push to main: the workflow builds and tests the package, then creates the
# release and its tag (for example v0.2.0) if that version has none yet.
name: Release

on:
  push:
    branches: [main]
    paths: ["packaging/VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the server
        working-directory: server
        run: cargo build --release --locked

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package
        shell: pwsh
        run: |
          $version = "v" + (Get-Content packaging/VERSION -Raw).Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "packaging/VERSION must look like 1.2.3" }
          New-Item -ItemType Directory -Path Peter | Out-Null
          Copy-Item server/target/release/peter-server.exe Peter/
          Copy-Item -Recurse web/dist Peter/web
          Copy-Item -Recurse extension Peter/extension
          Copy-Item packaging/windows/start-peter.cmd, packaging/windows/my-keys.example.cmd, packaging/windows/README-FIRST.txt Peter/
          $zip = "Peter-$version-windows.zip"
          Compress-Archive -Path Peter -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Starts the packaged server the way start-peter.cmd does and checks the
      # app and the API answer, so a broken package is never published.
      - name: Smoke-test the package
        shell: pwsh
        working-directory: Peter
        run: |
          $env:PETER_BIND = "127.0.0.1:5173"
          $env:PETER_WEB_DIR = (Resolve-Path web).Path
          $server = Start-Process -FilePath .\peter-server.exe -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $ok = (Invoke-WebRequest http://127.0.0.1:5173/healthz -UseBasicParsing).Content -eq "ok" } catch {}
            }
            if (-not $ok) { throw "The server did not start." }
            $page = Invoke-WebRequest http://127.0.0.1:5173/sessions/example -UseBasicParsing
            if ($page.Content -notmatch "<div id=`"root`">") { throw "The web app was not served." }
            $body = '{"email":"smoke@example.com","password":"smoke-test-pass-1","name":"Smoke","workspace_name":"Smoke"}'
            $signup = Invoke-RestMethod -Method Post http://127.0.0.1:5173/v1/auth/signup -ContentType "application/json" -Body $body
            if (-not $signup.access_token) { throw "Sign-up failed." }
            Write-Output "Package works: web app served, sign-up OK."
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: peter-windows
          path: ${{ env.ZIP }}

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:VERSION already exists; bump packaging/VERSION to publish a new one."
            exit 0
          }
          gh release create $env:VERSION $env:ZIP --target $env:GITHUB_SHA --title "Peter $env:VERSION for Windows" --notes-file packaging/windows/RELEASE_NOTES.md
