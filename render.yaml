# Render Blueprint: Dashboard → New → Blueprint → choose this repository.
# Render asks for each value marked "sync: false". See docs/DEPLOY.md.
services:
  - type: web
    name: peter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Encrypts workspace AI keys in the database. Render makes one up once
      # and keeps it; never change it, or saved keys can no longer be read.
      - key: PETER_SECRET_KEY
        generateValue: true
      # The most tokens each workspace may use per month on your OpenRouter
      # key. Workspaces can add their own key in "AI and usage" instead.
      - key: PETER_SHARED_AI_MONTHLY_TOKENS
        value: "300000"
      - key: PETER_ADMIN_EMAIL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
