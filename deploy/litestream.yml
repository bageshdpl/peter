# Continuous backup of Peter's database to S3-compatible storage (Supabase
# Storage, Backblaze B2, Cloudflare R2, AWS S3...). Values come from the
# BACKUP_S3_* environment variables; see docs/DEPLOY.md.
dbs:
  - path: ${PETER_DB_PATH}
    replicas:
      - type: s3
        bucket: ${BACKUP_S3_BUCKET}
        path: ${BACKUP_S3_PATH}
        endpoint: ${BACKUP_S3_ENDPOINT}
        region: ${BACKUP_S3_REGION}
        access-key-id: ${BACKUP_S3_ACCESS_KEY_ID}
        secret-access-key: ${BACKUP_S3_SECRET_ACCESS_KEY}
        force-path-style: true
        sync-interval: 1s
        snapshot-interval: 1h
        retention: 72h
