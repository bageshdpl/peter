# The automatic checker: on every push and pull request, GitHub builds and
# tests Peter on Linux and Windows and shows a green tick or a red cross.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new Rust release cannot turn the checks red on its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scripts and manifest
        working-directory: extension
        run: |
          for f in *.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

  hosting:
    name: Hosting image (backup and restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t peter:ci .
      - name: Start a test S3 server
        run: |
          docker run -d --name s3 --network host motoserver/moto:5.1.4 -p 9000
          for i in $(seq 1 60); do curl -s http://127.0.0.1:9000 >/dev/null && break; sleep 1; done
          curl -s http://127.0.0.1:9000 >/dev/null || { docker logs s3; exit 1; }
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb s3://peter-backup
      - name: Start Peter, create data, then wipe the container
        run: |
          set -e
          run() {
            docker run -d --name "$1" --network host \
              -e PORT=8080 -e PETER_APP_URL=https://peter-ci.example.com -e PETER_ADMIN_EMAIL=admin@example.com \
              -e BACKUP_S3_BUCKET=peter-backup -e BACKUP_S3_ENDPOINT=http://127.0.0.1:9000 -e BACKUP_S3_REGION=us-east-1 \
              -e BACKUP_S3_ACCESS_KEY_ID=test -e BACKUP_S3_SECRET_ACCESS_KEY=test peter:ci
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && return 0; sleep 1; done
            docker logs "$1"; exit 1
          }
          run first
          curl -sf http://127.0.0.1:8080/v1/meta | grep -q '"signup":"first_admin"'
          # A stranger cannot take the first account; the configured admin can.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/signup -H 'content-type: application/json' \
            -d '{"email":"stranger@example.com","password":"stranger-pass-1","name":"S","workspace_name":"S"}')
          test "$code" = 403
          token=$(curl -sf -X POST http://127.0.0.1:8080/v1/auth/signup -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"admin-pass-123","name":"Admin","workspace_name":"Acme"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST http://127.0.0.1:8080/v1/projects -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"name":"Survives restarts"}' >/dev/null
          curl -sf http://127.0.0.1:8080/v1/meta | grep -q '"signup":"invite_only"'
          # The extension download is set up for this server's address.
          curl -sf -o ext.zip http://127.0.0.1:8080/v1/extension/download
          unzip -p ext.zip peter-observer/config.js | grep -q 'https://peter-ci.example.com'
          unzip -p ext.zip peter-observer/manifest.json | grep -q 'https://peter-ci.example.com/\*'
          # The app pages are served.
          curl -sf http://127.0.0.1:8080/projects/anything | grep -q '<div id="root">'
          sleep 5
          docker stop first && docker rm first
          echo "Container wiped. Starting a fresh one."
          run second
          token=$(curl -sf -X POST http://127.0.0.1:8080/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"admin-pass-123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf http://127.0.0.1:8080/v1/projects -H "authorization: Bearer $token" | grep -q 'Survives restarts'
          echo "Data restored from the backup after a full wipe."
          docker logs second 2>&1 | grep -q 'restoring the database'
      - name: Logs
        if: failure()
        run: |
          docker logs first 2>&1 | tail -50 || true
          docker logs second 2>&1 | tail -50 || true
          docker logs s3 2>&1 | tail -30 || true
