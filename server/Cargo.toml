[package]
name = "peter-server"
version = "0.1.2"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ttf-parser = "0.25.1"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
